<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rafting Adventure - Home">
    <meta name="author" content="Daniel Arcos"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Rafting Adventure - Home</title>
</head>
<body>
    <header class="header">
        <div class="header_set" id="header_set">
            <div class="logo">
                <img src="images/templogo.png" alt="Rafting Adventure Logo">
            </div>
            <nav class="header_links">
                <a class="link a1" href="#">Home</a>
                <a class="link a2" href="./about.html">About</a>
                <a class="link a3" href="./trips.html">Trips</a>
                <a class="link a4" href="./contact.html">Contact</a>
            </nav>
        </div>
    </header>
    <main>
        <div id="hero_back">
            <div id="title"> <h1>Home</h1></div>
            <div id="form_home">
                <h2>Subscribe to Our Newsletter</h2>
                <form action="#" method="post">
                    <input type="text" name="name" placeholder="Your name" required>
                    <input type="email" name="email" placeholder="Your email" required>
                    <button type="submit">Submit</button>
                </form>
            </div>
            <div id="come_with_us">
                <nav id="a_come">
                    <a href="trips.html">Come with us</a>
                </nav>
                <div id="img_div_come">
                    <figure class="img1">
                    <img src="images/ExtremeRapidsChallenge.jpg" alt="Extreme Rapids Challenge" class="image-come">
                    <figcaption>Extreme Rapids Challenge</figcaption>
                    </figure>
                    <figure class="img2">
                        <img src="images/FamilyFloatAdventures.jpg" alt="Family Float Adventures" class="image-come">
                    <figcaption>Family Float Adventures</figcaption>
                    </figure>
                    <figure class="img3">
                    <img src="images/ScenicRiverEscapes.jpg" alt="Scenic River Escapes" class="image-come">
                    <figcaption>Scenic River Escapes</figcaption>
                    </figure>
                </div>
            </div>
        </div>
    </main>
    <footer class="container sociallinks">
        <p>©️2024 Rafting Adventure / Daniel Arcos</p>
        <nav>
            <a href="https://facebook.com">
                <img src="images/2959749_facebook_icon.png" alt="Facebook">
            </a>
            <a href="https://instagram.com">
                <img src="images/2959748_instagram_photo_share_icon.png" alt="Instagram">
            </a>
            <a href="https://x.com">
                <img src="images/211651_close_round_icon.png" alt="X (Twitter)">
            </a>
        </nav>
    </footer>
</body>
</html>
